<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לינק — פורטל מנהל בית ספר</title>

  <!-- Firebase compat v10 — אותה גרסה כמו admin-web, בלי שלב build -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13;
      --card: #1a1a24;
      --card2: #22222e;
      --border: #2a2a3a;
      --primary: #6c63ff;
      --primary-soft: rgba(108,99,255,0.12);
      --green: #10b981;
      --green-soft: rgba(16,185,129,0.12);
      --red: #ef4444;
      --red-soft: rgba(239,68,68,0.12);
      --amber: #f59e0b;
      --amber-soft: rgba(245,158,11,0.12);
      --purple: #a855f7;
      --purple-soft: rgba(168,85,247,0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --text: #f0f0f8;
      --text2: #9090b0;
      --text3: #5a5a7a;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; }
    .login-logo { font-size: 48px; font-weight: 900; color: var(--primary); text-align: center; letter-spacing: -2px; margin-bottom: 6px; }
    .login-sub { font-size: 12px; color: var(--text3); text-align: center; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 36px; }
    .login-title { font-size: 22px; font-weight: 800; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
    .field input { width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; color: var(--text); outline: none; transition: border-color .2s; direction: ltr; text-align: left; }
    .field input:focus { border-color: var(--primary); }
    .btn-primary { width: 100%; background: var(--primary); color: white; border: none; border-radius: 99px; padding: 14px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 8px; transition: opacity .2s; }
    .btn-primary:hover { opacity: .85; }
    .btn-primary:disabled { opacity: .5; cursor: default; }
    .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; line-height: 1.5; }

    /* ── APP SHELL ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--card); border-bottom: 2px solid var(--primary); display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 60px; position: sticky; top: 0; z-index: 100; }
    .topbar-logo { font-size: 22px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
    .topbar-school { font-size: 14px; font-weight: 800; }
    .topbar-title { font-size: 12px; color: var(--text3); flex: 1; }
    .topbar-user { font-size: 12px; color: var(--text3); }
    .btn-signout { background: var(--red-soft); border: 1px solid var(--red); color: var(--red); border-radius: 99px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .btn-signout:hover { background: var(--red); color: white; }

    /* ── TABS ── */
    .tabs { display: flex; gap: 4px; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; }
    .tab { padding: 14px 18px; font-size: 13px; font-weight: 700; color: var(--text3); cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s; white-space: nowrap; position: relative; }
    .tab:hover { color: var(--text2); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab .dot { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; text-align: center; background: var(--red); color: white; border-radius: 99px; font-size: 10px; font-weight: 900; margin-inline-start: 6px; padding: 0 5px; }

    /* ── CONTENT ── */
    .content { padding: 24px; max-width: 1240px; margin: 0 auto; width: 100%; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── STATS ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; border-top: 3px solid var(--primary); }
    .stat-card .ico { font-size: 26px; margin-bottom: 10px; }
    .stat-card .val { font-size: 34px; font-weight: 900; color: var(--primary); margin-bottom: 4px; }
    .stat-card .lbl { font-size: 12px; color: var(--text3); font-weight: 600; }
    .stat-card .sublbl { font-size: 11px; color: var(--text3); margin-top: 6px; }
    .stat-card.green { border-top-color: var(--green); } .stat-card.green .val { color: var(--green); }
    .stat-card.red { border-top-color: var(--red); } .stat-card.red .val { color: var(--red); }
    .stat-card.amber { border-top-color: var(--amber); } .stat-card.amber .val { color: var(--amber); }
    .stat-card.purple { border-top-color: var(--purple); } .stat-card.purple .val { color: var(--purple); }
    .stat-card.clickable { cursor: pointer; transition: border-color .2s; }
    .stat-card.clickable:hover { border-color: var(--primary); }

    /* ── SECTION ── */
    .section-title { font-size: 11px; font-weight: 900; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .section-title .hint { letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--text3); font-size: 11px; }
    .section-block { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 28px; }
    .section-pad { padding: 20px; }

    /* ── TABLE ── */
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th { padding: 12px 16px; font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; background: var(--card2); text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tbl td { padding: 13px 16px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr:hover td { background: var(--card2); }
    .tbl-empty { padding: 40px; text-align: center; color: var(--text3); font-size: 13px; line-height: 1.7; }
    .tbl-scroll { max-height: 62vh; overflow-y: auto; }
    .num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--text3); }

    /* ── BADGES ── */
    .badge { display: inline-flex; align-items: center; border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .badge-pending { background: var(--amber-soft); color: var(--amber); }
    .badge-approved { background: var(--green-soft); color: var(--green); }
    .badge-rejected { background: var(--red-soft); color: var(--red); }
    .badge-open { background: var(--red-soft); color: var(--red); }
    .badge-handled { background: var(--green-soft); color: var(--green); }
    .badge-staff { background: var(--purple-soft); color: var(--purple); }
    .badge-neutral { background: var(--card2); color: var(--text2); }
    .badge-auto { background: var(--primary-soft); color: var(--primary); }

    /* ── BUTTONS ── */
    .btn-sm { border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; transition: opacity .2s; white-space: nowrap; }
    .btn-sm:hover { opacity: .8; }
    .btn-sm:disabled { opacity: .4; cursor: default; }
    .btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid var(--red); }
    .btn-success { background: var(--green-soft); color: var(--green); border: 1px solid var(--green); }
    .btn-info { background: var(--primary-soft); color: var(--primary); border: 1px solid var(--primary); }
    .btn-ghost { background: var(--card2); color: var(--text2); border: 1px solid var(--border); }

    /* ── TOOLBAR ── */
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar .spacer { flex: 1; }
    .search-input { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 9px 14px; font-size: 13px; min-width: 220px; outline: none; font-family: inherit; }
    .search-input:focus { border-color: var(--primary); }
    .filter-select { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .date-input { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; font-family: inherit; color-scheme: dark; }
    .inline-select { background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-family: inherit; max-width: 150px; }

    /* ── CODE BOX ── */
    .code-box { display: inline-flex; align-items: center; gap: 8px; background: var(--card2); border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-family: 'SF Mono', Menlo, monospace; font-size: 18px; font-weight: 800; letter-spacing: 3px; direction: ltr; }

    /* ── BARS (תובנות) ── */
    .bar-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
    .bar-row .nm { width: 150px; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 10px; background: var(--card2); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width .3s; }
    .bar-row .vl { width: 70px; text-align: left; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }

    .spark { display: flex; align-items: flex-end; gap: 3px; height: 90px; padding: 16px; }
    .spark-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; }
    .spark-bar { width: 100%; background: var(--primary); border-radius: 3px 3px 0 0; min-height: 2px; }
    .spark-lbl { font-size: 9px; color: var(--text3); white-space: nowrap; }

    /* ── LOADER / NOTICE ── */
    .loader { text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }
    .spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin-left: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notice { border-radius: var(--radius-sm); padding: 12px 16px; font-size: 12.5px; line-height: 1.7; margin-bottom: 16px; }
    .notice-warn { background: var(--amber-soft); border: 1px solid var(--amber); color: var(--amber); }
    .notice-info { background: var(--primary-soft); border: 1px solid var(--primary); color: var(--text2); }
    .notice-danger { background: var(--red-soft); border: 1px solid var(--red); color: var(--red); }

    /* ── MODAL ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 24px; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; max-width: 480px; width: 100%; }
    .modal h3 { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
    .modal p { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.7; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-lbl { display: block; font-size: 11px; font-weight: 700; color: var(--text3); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
    .modal-input { width: 100%; background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 13px; outline: none; font-family: inherit; }
    .modal-input:focus { border-color: var(--primary); }

    /* ── TOAST ── */
    #toast { position: fixed; bottom: 24px; inset-inline-start: 24px; background: var(--card); border: 1px solid var(--primary); border-radius: var(--radius); padding: 12px 18px; font-size: 13px; font-weight: 700; z-index: 1000; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    #toast.err { border-color: var(--red); color: var(--red); }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .content { padding: 16px; }
      .topbar { padding: 0 16px; gap: 10px; }
      .topbar-title, .topbar-user { display: none; }
      .tabs { overflow-x: auto; padding: 0 16px; }
      .tbl th:nth-child(n+4), .tbl td:nth-child(n+4) { display: none; }
      .bar-row .nm { width: 100px; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">לינק</div>
    <div class="login-sub">School Portal</div>
    <div class="login-title">כניסת צוות בית הספר</div>
    <div class="field">
      <label>אימייל</label>
      <input type="email" id="login-email" placeholder="staff@school.co.il" autocomplete="username" />
    </div>
    <div class="field">
      <label>סיסמה</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">כניסה</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="topbar">
    <span class="topbar-logo">לינק</span>
    <span class="topbar-school" id="topbar-school">—</span>
    <span class="topbar-title">פורטל ניהול בית ספר</span>
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-signout" onclick="doSignOut()">התנתקות</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="overview" onclick="switchTab('overview')">📊 סקירה</div>
    <div class="tab" data-tab="alerts"   onclick="switchTab('alerts')">🆘 התראות מצוקה</div>
    <div class="tab" data-tab="mentors"  onclick="switchTab('mentors')">🤝 מתנדבים</div>
    <div class="tab" data-tab="hours"    onclick="switchTab('hours')">⏱ שעות</div>
    <div class="tab" data-tab="classes"  onclick="switchTab('classes')">📚 כיתות</div>
    <div class="tab" data-tab="staff"    onclick="switchTab('staff')">👩‍🏫 צוות</div>
    <div class="tab" data-tab="insights" onclick="switchTab('insights')">📈 תובנות</div>
    <div class="tab" data-tab="reports"  onclick="switchTab('reports')">📄 דוחות</div>
  </div>

  <div class="content">
    <div class="panel active" id="panel-overview"><div class="loader"><span class="spinner"></span> טוען נתונים...</div></div>
    <div class="panel" id="panel-alerts"></div>
    <div class="panel" id="panel-mentors"></div>
    <div class="panel" id="panel-hours"></div>
    <div class="panel" id="panel-classes"></div>
    <div class="panel" id="panel-staff"></div>
    <div class="panel" id="panel-insights"></div>
    <div class="panel" id="panel-reports"></div>
  </div>
</div>

<!-- ══ CONFIRM MODAL ══ -->
<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="btn-sm btn-ghost" onclick="closeModal()">ביטול</button>
      <button class="btn-sm btn-danger" id="modal-confirm-btn">אישור</button>
    </div>
  </div>
</div>

<!-- ══ PROMPT MODAL ══ -->
<div class="modal-overlay" id="prompt-modal" style="display:none" onclick="if(event.target===this)closePrompt()">
  <div class="modal">
    <h3 id="prompt-title"></h3>
    <p id="prompt-body" style="margin-bottom:14px"></p>
    <label class="modal-lbl" id="prompt-label">ערך</label>
    <input class="modal-input" id="prompt-input" />
    <div class="modal-actions" style="margin-top:20px">
      <button class="btn-sm btn-ghost" onclick="closePrompt()">ביטול</button>
      <button class="btn-sm btn-success" id="prompt-ok">שמירה</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════
//  פורטל מנהל בית ספר
//
//  כל שאילתה כאן מסוננת לבית ספר אחד — זה שעל מסמך המשתמש המחובר.
//  הסינון אינו קוסמטי: חוקי Firestore דוחים כל קריאה שלא נושאת את
//  התנאי, ולכן הסרת where מכאן שוברת את המסך במקום לחשוף נתונים.
//  ראה firestore.rules — isStaffOf().
// ══════════════════════════════════════════════════════════════════

const firebaseConfig = {
  apiKey: "AIzaSyB4r5hRhisIfZccycP2QAyvOqIIkNnSpr0",
  authDomain: "link-app-965dd.firebaseapp.com",
  projectId: "link-app-965dd",
  storageBucket: "link-app-965dd.firebasestorage.app",
  messagingSenderId: "87561510798",
  appId: "1:87561510798:android:eddf7ce73737cdc7b7cedf",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();
const fns  = firebase.app().functions('me-west1');

// ── State ────────────────────────────────────────────────────────
let me          = null;   // { uid, email, nickname }
let mySchoolId  = null;
let mySchool    = null;   // מסמך schools/{id}
let schoolCode  = null;   // נשלף רק בלחיצה על "הצג"

let users     = [];   // כל המשתמשים של בית הספר (צוות + מתנדבים)
let classes   = [];
let hours     = [];
let alerts    = [];
let sessions  = [];

let unsubs = [];
let currentTab = 'overview';
let loaded = { users: false, classes: false, hours: false, alerts: false, sessions: false };

// ══════════════════════════════════════════════════════════════════
//  Auth
// ══════════════════════════════════════════════════════════════════
auth.onAuthStateChanged(async user => {
  if (!user) { showLogin(); return; }
  try {
    // ההרשאה נקבעת ממסמך המשתמש ולא מ-claim: schoolId נכתב כ-claim רק
    // ב-registerStaffWithCode / adminMoveUserSchool, וטוקן ישן עלול
    // לשאת ערך ריק או ישן. מסמך המשתמש הוא מקור האמת, ובדיוק אותו
    // ערך הכללים קוראים כשה-claim חסר.
    const snap = await db.collection('users').doc(user.uid).get();
    const data = snap.exists ? snap.data() : null;

    if (!data || data.role !== 'staff') {
      setLoginError(data && data.role === 'admin'
        ? 'זהו פורטל בית הספר. לחשבון אדמין מערכת יש לוח בקרה נפרד.'
        : 'החשבון אינו מוגדר כאיש צוות בית ספר.');
      await auth.signOut();
      return;
    }
    if (!data.schoolId) {
      setLoginError('החשבון אינו משויך לבית ספר. יש לפנות לאדמין המערכת לשיוך.');
      await auth.signOut();
      return;
    }

    me = { uid: user.uid, email: user.email, nickname: data.nickname || user.email };
    mySchoolId = data.schoolId;

    const schoolSnap = await db.collection('schools').doc(mySchoolId).get();
    mySchool = schoolSnap.exists ? { id: schoolSnap.id, ...schoolSnap.data() } : { id: mySchoolId, name: data.schoolName || 'בית הספר שלי' };

    document.getElementById('topbar-school').textContent = mySchool.name || 'בית הספר שלי';
    document.getElementById('topbar-user').textContent = me.nickname;
    showApp();
    loadAll();
  } catch (e) {
    console.error(e);
    setLoginError('שגיאה בטעינת ההרשאות. נסה שוב.');
    await auth.signOut();
  }
});

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if (!email || !pass) { setLoginError('אנא מלא אימייל וסיסמה'); return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'מתחבר...';
  setLoginError('');
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch (e) {
    const msgs = {
      'auth/user-not-found': 'משתמש לא נמצא',
      'auth/wrong-password': 'סיסמה שגויה',
      'auth/invalid-email': 'אימייל לא תקין',

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  renderCurrent();
}

function renderAll() {
  renderBadges();
  renderCurrent();
}

// כל טאב נבנה מחדש מהמצב בזיכרון. ההאזנות הן real-time, ולכן
// רינדור מלא פשוט יותר — ובכמויות של בית ספר בודד גם זול.
function renderCurrent() {
  const fn = {
    overview: renderOverview,
    alerts:   renderAlerts,
    mentors:  renderMentors,
    hours:    renderHours,
    classes:  renderClasses,
    staff:    renderStaff,
    insights: renderInsights,
    reports:  renderReports,
  }[currentTab];
  if (fn) fn();
}

function renderBadges() {
  const openAlerts   = alerts.filter(a => a.status !== 'handled' && a.handled !== true).length;
  const pendingHours = hours.filter(h => h.status === 'pending').length;
  const pendingMentors = users.filter(u => u.role === 'mentor' && u.mentorStatus === 'pending').length;
  setDot('alerts',  openAlerts);
  setDot('hours',   pendingHours);
  setDot('mentors', pendingMentors);
}
function setDot(tab, n) {
  const el = document.querySelector(`.tab[data-tab="${tab}"]`);
  if (!el) return;
  const base = el.textContent.replace(/\s*\d+$/, '').trim();
  el.innerHTML = esc(base) + (n > 0 ? ` <span class="dot">${n}</span>` : '');
}

// ══════════════════════════════════════════════════════════════════
//  טעינת נתונים — real-time, הכל מסונן ל-mySchoolId
// ══════════════════════════════════════════════════════════════════
function loadAll() {
  // משתמשי בית הספר. מסננים לפי schoolId בלבד (שדה יחיד — בלי אינדקס
  // מורכב) ומפרידים לפי role בצד הלקוח. תלמידים לא מופיעים כאן
  // בכוונה: תלמיד הוא ישות גלובלית ואינו משויך לבית ספר.
  unsubs.push(db.collection('users').where('schoolId', '==', mySchoolId)
    .onSnapshot(snap => {
      users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      loaded.users = true;
      renderAll();
    }, err => onErr('משתמשים', err)));

  unsubs.push(db.collection('classes').where('schoolId', '==', mySchoolId)
    .onSnapshot(snap => {
      classes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'he'));
      loaded.classes = true;
      renderAll();
    }, err => onErr('כיתות', err)));

  unsubs.push(db.collection('mentoringHours').where('schoolId', '==', mySchoolId)
    .onSnapshot(snap => {
      hours = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => tsMs(b.createdAt) - tsMs(a.createdAt));
      loaded.hours = true;
      renderAll();
    }, err => onErr('שעות', err)));

  // ההתראה לא נושאת schoolId — לתלמיד אין שיוך. הניתוב נעשה בשרת
  // (sendDistressAlertNotification) שכותב notifySchoolIds לפי בתי
  // הספר של המלווים, וזה השדה היחיד שהכללים מתירים לסנן עליו.
  unsubs.push(db.collection('distressAlerts').where('notifySchoolIds', 'array-contains', mySchoolId)
    .onSnapshot(snap => {
      alerts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => tsMs(b.createdAt) - tsMs(a.createdAt));
      loaded.alerts = true;
      renderAll();
    }, err => onErr('התראות מצוקה', err)));

  // סשנים אוטומטיים — הבסיס לטאב התובנות. limit כדי שבית ספר ותיק
  // לא ימשוך עשרות אלפי מסמכים בכל טעינה.
  unsubs.push(db.collection('mentorSessions').where('schoolId', '==', mySchoolId)
    .orderBy('date', 'desc').limit(3000)
    .onSnapshot(snap => {
      sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      loaded.sessions = true;
      renderAll();
    }, err => {
      // חסר אינדקס (schoolId, date) → התובנות עובדות חלקית, לא קורסות
      loaded.sessions = true;
      onErr('סשנים', err, true);
      renderAll();
    }));
}

function onErr(what, err, quiet) {
  console.error(what, err);
  if (!quiet) toast(`שגיאה בטעינת ${what}: ${err.code || err.message}`, true);
}

// ══════════════════════════════════════════════════════════════════

const mentors      = () => users.filter(u => u.role === 'mentor');
const staffMembers = () => users.filter(u => u.role === 'staff');
const openAlerts   = () => alerts.filter(a => !isHandled(a));
const isHandled    = a => a.handled === true || a.status === 'handled' || a.status === 'closed';

/**
 * שעות מתוך רשומת דיווח.
 * שני מסלולי דיווח כותבים שדות שונים: דיווח ידני בווב כותב hours,
 * ודיווח מהמובייל ומעקב הזמן האוטומטי כותבים minutes. חיבור של שדה
 * אחד בלבד היה מציג חצי מהשעות בלי שום סימן לכך.
 */
function hoursOf(h) {
  if (typeof h.hours === 'number') return h.hours;
  if (typeof h.minutes === 'number') return h.minutes / 60;
  return 0;
}
const sumHours = list => list.reduce((s, h) => s + hoursOf(h), 0);

function userById(uid) { return users.find(u => u.id === uid); }
function classById(id) { return classes.find(c => c.id === id); }
function mentorName(h) {
  const u = userById(h.mentorUid);
  return (u && u.nickname) || h.mentorName || '—';
}

/** תאריך רשומת שעות: date ('YYYY-MM-DD') אם קיים, אחרת createdAt. */
function hourDate(h) {
  if (h.date) return String(h.date);
  const ms = tsMs(h.createdAt);
  return ms ? new Date(ms).toISOString().slice(0, 10) : '';
}

function dailyHours(days) {
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    out.push({
      key,
      label: `${d.getDate()}/${d.getMonth() + 1}`,
      value: sumHours(hours.filter(h => hourDate(h) === key)),
    });
  }
  return out;
}

function sparkline(data) {
  const max = Math.max(...data.map(d => d.value), 1);
  if (!data.some(d => d.value > 0)) {
    return `<div class="tbl-empty">אין דיווחי שעות בתקופה הזו</div>`;
  }
  return `<div class="spark">${data.map(d => `
    <div class="spark-col" title="${esc(d.label)} — ${fmtH(d.value)} שעות">
      <div class="spark-bar" style="height:${Math.max(2, (d.value / max) * 60)}px"></div>
      <div class="spark-lbl">${esc(d.label)}</div>
    </div>`).join('')}</div>`;
}

function codeBlockHtml() {
  return `
    <p style="font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:16px">
      מורה חדש/ה נרשם/ת באפליקציה ובוחר/ת "צוות בית ספר", ומזין/ה את הקוד הזה.
      הקוד הוא הדרך היחידה לקבל הרשאת צוות — אל תפרסמו אותו בערוץ פתוח.
    </p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      ${schoolCode
        ? `<span class="code-box" id="code-text">${esc(schoolCode)}</span>
           <button class="btn-sm btn-info" onclick="copyCode()">📋 העתקה</button>
           <button class="btn-sm btn-ghost" onclick="hideCode()">הסתרה</button>`
        : `<span class="code-box">••••••••</span>
           <button class="btn-sm btn-info" onclick="revealCode()">👁 הצגת הקוד</button>`}
      <button class="btn-sm btn-danger" onclick="confirmRotateCode()">🔄 רענון קוד</button>
    </div>`;
}

async function revealCode() {
  try {
    const snap = await db.collection('schools').doc(mySchoolId).collection('private').doc('code').get();
    if (!snap.exists) { toast('לא נמצא קוד לבית הספר. פנה לאדמין המערכת.', true); return; }
    schoolCode = snap.data().code;
    document.getElementById('code-block').innerHTML = codeBlockHtml();
  } catch (e) {
    // עד לפריסת חוקי האבטחה המעודכנים הקריאה חסומה לצוות
    toast(e.code === 'permission-denied'
      ? 'הצגת הקוד דורשת פריסה של firestore.rules המעודכן'
      : 'שגיאה בשליפת הקוד', true);
  }
}
function hideCode() { schoolCode = null; document.getElementById('code-block').innerHTML = codeBlockHtml(); }
function copyCode() {
  navigator.clipboard.writeText(schoolCode || '').then(() => toast('הקוד הועתק'));
}
function confirmRotateCode() {
  openModal('רענון קוד ההרשמה',
    'ייווצר קוד חדש, והקוד הנוכחי יפסיק לעבוד מיידית. מי שכבר נרשם איתו לא מושפע — השיוך שלו כבר שמור. ' +
    'השתמשו בזה אם הקוד דלף.',
    async () => {
      try {
        const res = await fns.httpsCallable('staffRotateSchoolCode')({});
        schoolCode = res.data.code;
        document.getElementById('code-block').innerHTML = codeBlockHtml();
        toast('נוצר קוד חדש');

      }

}

            return `
            <tr>
              <td><b>${esc(m.nickname || '—')}</b></td>
              <td class="muted" style="direction:ltr;text-align:right">${esc(m.email || '—')}</td>
              <td>
                <select class="inline-select" onchange="assignClass('${m.id}', this.value)">
                  <option value="">— ללא כיתה —</option>
                  ${classes.map(c => `<option value="${esc(c.id)}" ${m.classId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
                </select>
              </td>
              <td class="num">${fmtH(sumHours(mh.filter(h => h.status === 'approved')))}</td>
              <td class="muted">${last ? esc(fmtDay(last)) : '—'}</td>
              <td>${statusBadge(m.mentorStatus)}</td>
              <td>
                ${m.mentorStatus !== 'approved' ? `<button class="btn-sm btn-success" onclick="setMentorStatus('${m.id}','approved')">אישור</button>` : ''}
                ${m.mentorStatus !== 'rejected' ? `<button class="btn-sm btn-danger" onclick="setMentorStatus('${m.id}','rejected')">${m.mentorStatus === 'approved' ? 'השעיה' : 'דחייה'}</button>` : ''}
              </td>
            </tr>`;
          }).join('')
          : `<tr><td colspan="7" class="tbl-empty">אין מתנדבים התואמים לסינון.</td></tr>`}
        </tbody>
      </table>
    </div></div>`);
}

function statusRank(m) { return { pending: 0, approved: 1, rejected: 2 }[m.mentorStatus || 'pending'] ?? 3; }
function statusBadge(s) {
  const map = { approved: ['badge-approved', 'מאושר'], rejected: ['badge-rejected', 'מושעה'], pending: ['badge-pending', 'ממתין'] };
  const [cls, label] = map[s] || map.pending;
  return `<span class="badge ${cls}">${label}</span>`;
}

async function setMentorStatus(uid, status) {
  try {
    // החוקים מתירים לצוות לשנות רק את המפתחות האלה, ורק למתנדבי
    // בית הספר שלו — ולכן העדכון חייב להישאר מינימלי.
    await db.collection('users').doc(uid).update({ mentorStatus: status });
    toast(status === 'approved' ? 'המתנדב/ת אושר/ה' : 'הסטטוס עודכן');
  } catch (e) { toast('שגיאה: ' + (e.code || e.message), true); }
}

async function assignClass(uid, classId) {
  const c = classById(classId);
  try {
    await db.collection('users').doc(uid).update(classId
      ? { classId, className: c ? c.name : null }
      // מחיקה ולא null: הכללים בודקים get('classId','') == '' ומול null
      // הבדיקה נכשלת ועוברת לאימות כיתה שאינה קיימת
      : {
          classId: firebase.firestore.FieldValue.delete(),
          className: firebase.firestore.FieldValue.delete(),
        });
    toast(classId ? `שויך ל${c ? c.name : 'כיתה'}` : 'השיוך לכיתה בוטל');
  } catch (e) {
    toast(e.code === 'permission-denied'
      ? 'שיוך לכיתה דורש פריסה של firestore.rules המעודכן'
      : 'שגיאה: ' + (e.code || e.message), true);
    renderMentors();
  }
}

let hoursStatusFilter = 'pending', hoursFrom = '', hoursTo = '';

function renderHours() {

  const list = filteredHours();

  setPanel('hours', `
    <div class="toolbar">
      <select class="filter-select" onchange="hoursStatusFilter=this.value;renderHours()">
        <option value="pending"  ${hoursStatusFilter === 'pending'  ? 'selected' : ''}>ממתינות לאישור</option>
        <option value="approved" ${hoursStatusFilter === 'approved' ? 'selected' : ''}>מאושרות</option>
        <option value="rejected" ${hoursStatusFilter === 'rejected' ? 'selected' : ''}>נדחו</option>
        <option value=""         ${hoursStatusFilter === ''         ? 'selected' : ''}>הכל</option>
      </select>
      <input type="date" class="date-input" value="${esc(hoursFrom)}" onchange="hoursFrom=this.value;renderHours()" />
      <span class="muted">עד</span>
      <input type="date" class="date-input" value="${esc(hoursTo)}" onchange="hoursTo=this.value;renderHours()" />
      <div class="spacer"></div>
      <span class="muted" style="font-size:12px">${list.length} רשומות · ${fmtH(sumHours(list))} שעות</span>
      ${pending.length > 1 ? `<button class="btn-sm btn-success" onclick="confirmApproveAll()">אישור כל ה-${pending.length} המסוננות</button>` : ''}
      <button class="btn-sm btn-ghost" onclick="exportHours()">⬇ יצוא CSV</button>
    </div>

    <div class="section-block"><div class="tbl-scroll">
      <table class="tbl">
        <thead><tr>
          <th>מתנדב/ת</th><th>תאריך</th><th>שעות</th><th>תיאור</th>
          <th>מקור</th><th>סטטוס</th><th style="width:150px">פעולות</th>
        </tr></thead>
        <tbody>
          ${list.length ? list.map(h => `
            <tr>
              <td><b>${esc(mentorName(h))}</b></td>
              <td class="muted num">${esc(fmtDay(hourDate(h)))}</td>
              <td class="num"><b>${fmtH(hoursOf(h))}</b></td>
              <td class="muted">${esc(h.description || h.note || '—')}</td>
              <td>${h.type === 'auto'
                    ? `<span class="badge badge-auto" title="נמדד אוטומטית ע\\"י מעקב הזמן באפליקציה">אוטומטי</span>`
                    : `<span class="badge badge-neutral">ידני</span>`}</td>
              <td>${hoursBadge(h.status)}</td>
              <td>
                ${h.status !== 'approved' ? `<button class="btn-sm btn-success" onclick="setHoursStatus('${h.id}','approved')">אישור</button>` : ''}
                ${h.status !== 'rejected' ? `<button class="btn-sm btn-danger" onclick="setHoursStatus('${h.id}','rejected')">דחייה</button>` : ''}
              </td>
            </tr>`).join('')
          : `<tr><td colspan="7" class="tbl-empty">אין דיווחי שעות התואמים לסינון.</td></tr>`}
        </tbody>
      </table>
    </div></div>`);
}

function filteredHours() {
  return hours.filter(h => {
    if (hoursStatusFilter && h.status !== hoursStatusFilter) return false;
    const d = hourDate(h);
    if (hoursFrom && d < hoursFrom) return false;
    if (hoursTo && d > hoursTo) return false;
    return true;
  });
}

function hoursBadge(s) {
  const map = { approved: ['badge-approved', 'מאושר'], rejected: ['badge-rejected', 'נדחה'], pending: ['badge-pending', 'ממתין'] };
  const [cls, label] = map[s] || map.pending;
  return `<span class="badge ${cls}">${label}</span>`;
}

async function setHoursStatus(id, status) {
  try {
    await db.collection('mentoringHours').doc(id).update({
      status,
      approvedBy: me.uid,
      approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    toast(status === 'approved' ? 'השעות אושרו' : 'הדיווח נדחה');
  } catch (e) { toast('שגיאה: ' + (e.code || e.message), true); }
}

function confirmApproveAll() {
  const pending = filteredHours().filter(h => h.status === 'pending');
  openModal(`אישור ${pending.length} דיווחים`,
    `יאושרו כל הדיווחים הממתינים שתואמים לסינון הנוכחי — ${fmtH(sumHours(pending))} שעות בסך הכל. ` +
    `הפעולה אינה הפיכה בלחיצה אחת; ביטול נעשה דיווח-דיווח.`,
    async () => {
      let ok = 0, fail = 0;
      for (const h of pending) {
        try {
          await db.collection('mentoringHours').doc(h.id).update({
            status: 'approved',
            approvedBy: me.uid,
            approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          ok++;
        } catch { fail++; }
      }
      toast(fail ? `אושרו ${ok}, נכשלו ${fail}` : `אושרו ${ok} דיווחים`, !!fail);
    }, 'btn-success');
}

async function createClass() {
  const input = document.getElementById('new-class-name');
  const name = input.value.trim();
  if (!name) { toast('הזינו שם כיתה', true); return; }
  if (classes.some(c => (c.name || '').trim() === name)) { toast('כיתה בשם הזה כבר קיימת', true); return; }
  try {
    await db.collection('classes').add({
      name,
      // בלי schoolId החוקים דוחים את היצירה, והכיתה גם לא תופיע באף
      // שאילתה של בית הספר
      schoolId: mySchoolId,
      teacherUid: me.uid,
      teacherName: me.nickname || me.email || null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    input.value = '';
    toast('הכיתה נוספה');
  } catch (e) { toast('שגיאה: ' + (e.code || e.message), true); }
}

function renameClass(id) {
  const c = classById(id);
  openPrompt('שינוי שם כיתה', 'השם מוצג גם בטופס ההרשמה של מתנדבים חדשים.', 'שם הכיתה', c ? c.name : '',
    async name => {
      if (!name.trim()) return;
      try {
        await db.collection('classes').doc(id).update({ name: name.trim() });
        // השם שמור בהעתק גם על מסמכי המתנדבים; מסנכרנים כדי שהטבלאות
        // לא יציגו את השם הישן
        const affected = mentors().filter(m => m.classId === id);
        for (const m of affected) {
          try { await db.collection('users').doc(m.id).update({ className: name.trim() }); } catch {}
        }
        toast('השם עודכן');
      } catch (e) { toast('שגיאה: ' + (e.code || e.message), true); }
    });
}

function confirmDeleteClass(id) {
  const c = classById(id);
  const inClass = mentors().filter(m => m.classId === id);
  openModal(`מחיקת ${c ? c.name : 'כיתה'}`,
    inClass.length
      ? `${inClass.length} מתנדבים משויכים לכיתה הזו. הם לא יימחקו, אבל יישארו עם שיוך לכיתה שאינה קיימת — ` +
        `עדיף לשייך אותם מחדש קודם, בטאב המתנדבים.`
      : 'הכיתה תימחק. שעות שכבר דווחו תחתיה נשמרות ואינן מושפעות.',

      try {

        toast('הכיתה נמחקה');

}

let insightRange = 30;

function renderInsights() {
  if (!loaded.users || !loaded.hours) return setPanel('insights', loaderHtml());

  const inRange   = hours.filter(h => daysAgo(hourDate(h)) <= insightRange);
  const approvedR = inRange.filter(h => h.status === 'approved');
  const active    = mentors().filter(m => m.mentorStatus === 'approved');

  // "פעיל" = דיווח לפחות פעם אחת בטווח. מתנדב מאושר שלא דיווח כלל
  // הוא בדיוק מי שצריך תזכורת, ולכן הוא נספר בנפרד ולא נעלם בממוצע.
  const reported  = new Set(inRange.map(h => h.mentorUid));
  const dormant   = active.filter(m => !reported.has(m.id));

  const perMentor = active.map(m => ({
    name: m.nickname || '—',
    value: sumHours(approvedR.filter(h => h.mentorUid === m.id)),
  })).sort((a, b) => b.value - a.value);

  const perClass = classes.map(c => ({
    name: c.name || '—',
    value: sumHours(approvedR.filter(h => h.classId === c.id)),
  })).sort((a, b) => b.value - a.value);

  const alertsRange = alerts.filter(a => daysAgo(dayOf(a.createdAt)) <= insightRange);
  const avgHandle   = avgHandleHours(alertsRange);
  const sessionMins = sessions
    .filter(s => daysAgo(s.date) <= insightRange)
    .reduce((sum, s) => sum + (s.minutes || 0), 0);

  setPanel('insights', `
    <div class="toolbar">
      <span class="muted" style="font-size:12px">טווח:</span>
      ${[7, 30, 90, 365].map(d => `
        <button class="btn-sm ${insightRange === d ? 'btn-info' : 'btn-ghost'}"
                onclick="insightRange=${d};renderInsights()">${d === 365 ? 'שנה' : d + ' ימים'}</button>`).join('')}
    </div>

    <div class="stats-grid">
      <div class="stat-card green">
        <div class="ico">📈</div><div class="val">${fmtH(sumHours(approvedR))}</div>
        <div class="lbl">שעות מאושרות בטווח</div>
        <div class="sublbl">ממוצע ${fmtH(active.length ? sumHours(approvedR) / active.length : 0)} למתנדב</div>
      </div>
      <div class="stat-card ${dormant.length ? 'amber' : 'green'}">
        <div class="ico">😴</div><div class="val">${dormant.length}</div>
        <div class="lbl">מתנדבים מאושרים ללא דיווח</div>
        <div class="sublbl">מתוך ${active.length} מאושרים</div>
      </div>
      <div class="stat-card red">
        <div class="ico">🆘</div><div class="val">${alertsRange.length}</div>
        <div class="lbl">התראות מצוקה בטווח</div>
        <div class="sublbl">${avgHandle === null ? 'טרם נמדד זמן טיפול' : 'זמן טיפול ממוצע ' + fmtH(avgHandle) + ' שעות'}</div>
      </div>
      <div class="stat-card purple">
        <div class="ico">⏱</div><div class="val">${fmtH(sessionMins / 60)}</div>
        <div class="lbl">זמן שימוש נמדד באפליקציה</div>
        <div class="sublbl">${loaded.sessions ? 'מעקב אוטומטי' : 'לא נטען'}</div>
      </div>
    </div>

    ${dormant.length ? `
      <div class="section-title">מתנדבים שלא דיווחו כלל בטווח <span class="hint">כאן מתחיל הנשירה — שווה פנייה יזומה</span></div>
      <div class="section-block">
        <table class="tbl">
          <thead><tr><th>מתנדב/ת</th><th>כיתה</th><th>דיווח אחרון אי פעם</th><th>אימייל</th></tr></thead>
          <tbody>
            ${dormant.map(m => {
              const mh = hours.filter(h => h.mentorUid === m.id);
              return `<tr>
                <td><b>${esc(m.nickname || '—')}</b></td>
                <td>${esc(m.className || '—')}</td>
                <td class="muted">${mh.length ? esc(fmtDay(hourDate(mh[0]))) : 'מעולם לא דיווח'}</td>
                <td class="muted" style="direction:ltr;text-align:right">${esc(m.email || '—')}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>` : ''}

    <div class="section-title">שעות לפי מתנדב/ת <span class="hint">מאושרות בלבד</span></div>
    <div class="section-block" style="padding:8px 0">${bars(perMentor)}</div>

    <div class="section-title">שעות לפי כיתה</div>
    <div class="section-block" style="padding:8px 0">${bars(perClass)}</div>

    <div class="section-title">מגמת שעות שבועית</div>
    <div class="section-block">${sparkline(weeklyHours(Math.min(12, Math.ceil(insightRange / 7))))}</div>
  `);
}

function bars(data) {
  const list = data.filter(d => d.value > 0);
  if (!list.length) return `<div class="tbl-empty">אין נתונים בטווח שנבחר</div>`;
  const max = Math.max(...list.map(d => d.value));
  return list.map(d => `
    <div class="bar-row">
      <div class="nm" title="${esc(d.name)}">${esc(d.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.value / max) * 100}%"></div></div>
      <div class="vl">${fmtH(d.value)}</div>
    </div>`).join('');
}

function weeklyHours(weeks) {
  const out = [];
  for (let i = weeks - 1; i >= 0; i--) {
    const end = new Date(); end.setDate(end.getDate() - i * 7);
    const start = new Date(end); start.setDate(start.getDate() - 6);
    const s = start.toISOString().slice(0, 10), e = end.toISOString().slice(0, 10);
    out.push({
      label: `${start.getDate()}/${start.getMonth() + 1}`,
      value: sumHours(hours.filter(h => { const d = hourDate(h); return d >= s && d <= e; })),
    });
  }
  return out;
}

/** זמן טיפול ממוצע בשעות. מחזיר null אם אף התראה לא נסגרה עם חותמת. */
function avgHandleHours(list) {
  const done = list.filter(a => isHandled(a) && tsMs(a.handledAt) && tsMs(a.createdAt));
  if (!done.length) return null;
  return done.reduce((s, a) => s + (tsMs(a.handledAt) - tsMs(a.createdAt)) / 3600000, 0) / done.length;
}

// ══════════════════════════════════════════════════════════════════
//  8. דוחות
// ══════════════════════════════════════════════════════════════════
let repFrom = '', repTo = '';

function renderReports() {
  if (!repFrom) { const d = new Date(); d.setMonth(d.getMonth() - 1); repFrom = d.toISOString().slice(0, 10); }
  if (!repTo) repTo = new Date().toISOString().slice(0, 10);

  const rows = reportRows();
  const total = rows.reduce((s, r) => s + r.approved, 0);

  setPanel('reports', `
    <div class="toolbar">
      <span class="muted" style="font-size:12px">מתאריך</span>
      <input type="date" class="date-input" value="${esc(repFrom)}" onchange="repFrom=this.value;renderReports()" />
      <span class="muted" style="font-size:12px">עד</span>
      <input type="date" class="date-input" value="${esc(repTo)}" onchange="repTo=this.value;renderReports()" />
      <div class="spacer"></div>
      <button class="btn-sm btn-info" onclick="exportReport()">⬇ דוח מרוכז (CSV)</button>
      <button class="btn-sm btn-ghost" onclick="exportHoursRange()">⬇ כל הדיווחים (CSV)</button>
    </div>

    <div class="notice notice-info">
      קובצי ה-CSV נשמרים בקידוד UTF-8 עם BOM ונפתחים באקסל עם עברית תקינה בלחיצה כפולה.
    </div>

    <div class="section-title">
      דוח שעות מתנדבים
      <span class="hint">${esc(fmtDay(repFrom))} — ${esc(fmtDay(repTo))} · ${fmtH(total)} שעות מאושרות</span>
    </div>
    <div class="section-block"><div class="tbl-scroll">
      <table class="tbl">
        <thead><tr>
          <th>מתנדב/ת</th><th>כיתה</th><th>סטטוס</th>
          <th>דיווחים</th><th>מאושרות</th><th>ממתינות</th><th>נדחו</th><th>דיווח אחרון</th>
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(r => `
            <tr>
              <td><b>${esc(r.name)}</b></td>
              <td>${esc(r.className)}</td>
              <td>${statusBadge(r.mentorStatus)}</td>
              <td class="num">${r.count}</td>
              <td class="num"><b>${fmtH(r.approved)}</b></td>
              <td class="num muted">${fmtH(r.pending)}</td>
              <td class="num muted">${fmtH(r.rejected)}</td>
              <td class="muted">${r.last ? esc(fmtDay(r.last)) : '—'}</td>
            </tr>`).join('')
          : `<tr><td colspan="8" class="tbl-empty">אין מתנדבים להצגה.</td></tr>`}
        </tbody>
        ${rows.length ? `<tfoot><tr>
          <td colspan="4"><b>סה"כ</b></td>
          <td class="num"><b>${fmtH(total)}</b></td>
          <td class="num muted">${fmtH(rows.reduce((s, r) => s + r.pending, 0))}</td>
          <td class="num muted">${fmtH(rows.reduce((s, r) => s + r.rejected, 0))}</td>
          <td></td>
        </tr></tfoot>` : ''}
      </table>
    </div></div>`);
}

function inRepRange(h) {
  const d = hourDate(h);
  return (!repFrom || d >= repFrom) && (!repTo || d <= repTo);
}

function reportRows() {
  return mentors().map(m => {
    const mh = hours.filter(h => h.mentorUid === m.id && inRepRange(h));
    return {
      name: m.nickname || '—',
      email: m.email || '',
      className: m.className || (classById(m.classId) || {}).name || '—',
      mentorStatus: m.mentorStatus,
      count: mh.length,
      approved: sumHours(mh.filter(h => h.status === 'approved')),
      pending:  sumHours(mh.filter(h => h.status === 'pending')),
      rejected: sumHours(mh.filter(h => h.status === 'rejected')),
      last: mh.length ? hourDate(mh[0]) : '',
    };
  }).sort((a, b) => b.approved - a.approved);
}

// ── יצוא ────────────────────────────────────────────────────────
function exportReport() {
  const rows = reportRows().map(r => ({
    'מתנדב/ת': r.name, 'אימייל': r.email, 'כיתה': r.className,
    'סטטוס': statusText(r.mentorStatus), 'מספר דיווחים': r.count,
    'שעות מאושרות': fmtH(r.approved), 'שעות ממתינות': fmtH(r.pending),
    'שעות שנדחו': fmtH(r.rejected), 'דיווח אחרון': r.last,
  }));
  downloadCsv(`דוח-שעות-${repFrom}-${repTo}`, rows);
}

function exportHoursRange() {
  const rows = hours.filter(inRepRange).map(h => hourRow(h));
  downloadCsv(`דיווחי-שעות-${repFrom}-${repTo}`, rows);
}

function exportHours() {
  downloadCsv('שעות-מסוננות', filteredHours().map(h => hourRow(h)));
}

function hourRow(h) {
  const m = userById(h.mentorUid) || {};
  return {
    'מתנדב/ת': mentorName(h), 'אימייל': m.email || '',
    'כיתה': h.className || m.className || '',
    'תאריך': hourDate(h), 'שעות': fmtH(hoursOf(h)),
    'תיאור': h.description || h.note || '',
    'מקור': h.type === 'auto' ? 'אוטומטי' : 'ידני',
    'סטטוס': statusText(h.status),
    'אושר ע"י': nickOf(h.approvedBy) || '',
  };
}

function exportMentors() {
  downloadCsv('מתנדבים', mentors().map(m => {
    const mh = hours.filter(h => h.mentorUid === m.id);
    return {
      'שם': m.nickname || '', 'אימייל': m.email || '',
      'כיתה': m.className || '', 'סטטוס': statusText(m.mentorStatus),
      'שעות מאושרות': fmtH(sumHours(mh.filter(h => h.status === 'approved'))),
      'מספר דיווחים': mh.length,
      'דיווח אחרון': mh.length ? hourDate(mh[0]) : '',
      'נרשם': dayOf(m.createdAt),
    };
  }));
}

function exportAlerts() {
  downloadCsv('התראות-מצוקה', alerts.map(a => ({
    'תלמיד/ה': a.nickname || '', 'סיבה': a.reasonText || a.message || '',
    'תאריך': dayOf(a.createdAt), 'שעה': fmtTime(a.createdAt),
    'סטטוס': isHandled(a) ? 'טופל' : 'פתוח',
    'טופל ע"י': nickOf(a.handledBy) || '',
    'זמן עד טיפול (שעות)': isHandled(a) && tsMs(a.handledAt)
      ? fmtH((tsMs(a.handledAt) - tsMs(a.createdAt)) / 3600000) : '',
  })));
}

function statusText(s) {
  return { approved: 'מאושר', rejected: 'נדחה', pending: 'ממתין' }[s] || 'ממתין';
}

/**
 * הורדת CSV.
 * ה-BOM בתחילת הקובץ הוא לא קישוט: בלעדיו אקסל בווינדוס קורא את
 * הקובץ כ-Windows-1255 והעברית יוצאת ג'יבריש.
 */
function downloadCsv(name, rows) {
  if (!rows.length) { toast('אין נתונים ליצוא', true); return; }
  const cols = Object.keys(rows[0]);
  const escCell = v => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => escCell(r[c])).join(','))].join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`יוצאו ${rows.length} שורות`);
}

// ══════════════════════════════════════════════════════════════════
//  Helpers
// ══════════════════════════════════════════════════════════════════
function setPanel(id, html) { document.getElementById('panel-' + id).innerHTML = html; }
function loaderHtml() { return '<div class="loader"><span class="spinner"></span> טוען נתונים...</div>'; }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;');
}

function nickOf(uid) { const u = userById(uid); return u ? (u.nickname || u.email) : ''; }

/** Firestore Timestamp / ISO string / Date → מילישניות, או 0. */
function tsMs(v) {
  if (!v) return 0;
  try {
    if (typeof v.toDate === 'function') return v.toDate().getTime();
    const t = new Date(v).getTime();
    return isNaN(t) ? 0 : t;
  } catch { return 0; }
}
function dayOf(v) { const ms = tsMs(v); return ms ? new Date(ms).toISOString().slice(0, 10) : ''; }

function fmtDate(v) { const ms = tsMs(v); return ms ? new Date(ms).toLocaleDateString('he-IL') : '—'; }
function fmtTime(v) { const ms = tsMs(v); return ms ? new Date(ms).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : ''; }
function fmtFull(v) { const ms = tsMs(v); return ms ? new Date(ms).toLocaleString('he-IL') : ''; }
function fmtDay(d) {
  if (!d) return '—';
  const t = new Date(d + 'T00:00:00');
  return isNaN(t) ? d : t.toLocaleDateString('he-IL');
}
function fmtH(n) { return (Math.round((n || 0) * 10) / 10).toString(); }

function daysAgo(dateStr) {
  if (!dateStr) return Infinity;
  const t = new Date(dateStr + 'T00:00:00').getTime();
  if (isNaN(t)) return Infinity;
  return Math.floor((Date.now() - t) / 86400000);
}

function timeAgo(v) {
  const ms = tsMs(v);
  if (!ms) return '—';
  const mins = Math.floor((Date.now() - ms) / 60000);
  if (mins < 1) return 'עכשיו';
  if (mins < 60) return `לפני ${mins} דק'`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `לפני ${hrs} שע'`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `לפני ${days} ימים`;
  return new Date(ms).toLocaleDateString('he-IL');
}

/** רינדור מלא מאפס את הקלט; מחזירים את הסמן לסוף כדי שהחיפוש יהיה שמיש. */
function focusEnd(el) {
  const v = el.value;
  requestAnimationFrame(() => {
    const fresh = document.querySelector('#panel-' + currentTab + ' .search-input');
    if (fresh) { fresh.focus(); fresh.setSelectionRange(v.length, v.length); }
  });
}

// ── Modals ──────────────────────────────────────────────────────
let modalAction = null;
function openModal(title, body, onConfirm, btnClass) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  const btn = document.getElementById('modal-confirm-btn');
  btn.className = 'btn-sm ' + (btnClass || 'btn-danger');
  modalAction = onConfirm;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; modalAction = null; }
document.getElementById('modal-confirm-btn').onclick = async () => {
  const fn = modalAction; closeModal();
  if (fn) await fn();
};

let promptAction = null;
function openPrompt(title, body, label, value, onOk) {
  document.getElementById('prompt-title').textContent = title;
  document.getElementById('prompt-body').textContent = body;
  document.getElementById('prompt-label').textContent = label;
  const input = document.getElementById('prompt-input');
  input.value = value || '';
  promptAction = onOk;
  document.getElementById('prompt-modal').style.display = 'flex';
  setTimeout(() => input.focus(), 30);
}
function closePrompt() { document.getElementById('prompt-modal').style.display = 'none'; promptAction = null; }
document.getElementById('prompt-ok').onclick = async () => {
  const fn = promptAction, val = document.getElementById('prompt-input').value;
  closePrompt();
  if (fn) await fn(val);
};
document.getElementById('prompt-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('prompt-ok').click();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closePrompt(); }
});

// ── Toast ───────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, isErr ? 5000 : 2600);
}
</script>
